  <defs>
    <linearGradient id="neuroSatvaGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0f3f8f"/>
      <stop offset=".28" stop-color="#28116f"/>
      <stop offset=".48" stop-color="#5521b6"/>
      <stop offset=".66" stop-color="#0b8fa1"/>
      <stop offset="1" stop-color="#008b82"/>
